name: Relocatable ASan audit
on: workflow_dispatch
permissions:
  contents: read
jobs:
  asan:
    name: '${{ matrix.mode }} shared ASan'
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, relocatable]
    env:
      MODE: ${{ matrix.mode }}
      CC: clang
      CXX: clang++
      PYTHONSTRICTEXTENSIONBUILD: 1
      PYTHON_COLORS: 0
      ASAN_OPTIONS: detect_leaks=0 allocator_may_return_null=1 handle_segv=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d9edafda968da8263c2168851e34e7909a4f4f5b
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo ./.github/workflows/posix-deps-apt.sh
          clang --version
          echo "BUILD_DIR=$RUNNER_TEMP/asan-build" >> "$GITHUB_ENV"
          echo "INSTALL_DIR=$RUNNER_TEMP/asan-install" >> "$GITHUB_ENV"
      - name: Build shared interpreter
        run: |
          mkdir "$BUILD_DIR"
          cd "$BUILD_DIR"
          configure_args=(--prefix="$INSTALL_DIR" --enable-shared --with-address-sanitizer --without-pymalloc --with-pydebug --with-ensurepip=no 'OPT=-O2 -g')
          if [ "$MODE" = relocatable ]; then
            configure_args+=(--enable-relocatable)
          fi
          "$GITHUB_WORKSPACE/configure" "${configure_args[@]}"
          make -j4 > "$RUNNER_TEMP/build.log" 2>&1 || { tail -200 "$RUNNER_TEMP/build.log"; exit 1; }
          readelf -d ./python
          make pythoninfo
      - name: Run ordinary build suite
        run: |
          cd "$BUILD_DIR"
          make test TESTOPTS='-j4 -W --timeout=900 --slowest'
      - name: Install and move relocatable build
        if: matrix.mode == 'relocatable' && !cancelled()
        run: |
          cd "$BUILD_DIR"
          make install > "$RUNNER_TEMP/install.log" 2>&1 || { tail -200 "$RUNNER_TEMP/install.log"; exit 1; }
          cd "$RUNNER_TEMP"
          mv "$BUILD_DIR" "${BUILD_DIR}-unavailable"
          mv "$INSTALL_DIR" "${INSTALL_DIR} moved"
          echo "INSTALLED_PYTHON=${INSTALL_DIR} moved/bin/python3" >> "$GITHUB_ENV"
          readelf -d "${INSTALL_DIR} moved/bin/python3"
      - name: Run moved installed tests
        if: matrix.mode == 'relocatable' && !cancelled()
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD PYTHONHOME PYTHONPATH
          "$INSTALLED_PYTHON" -m test -j4 -W --timeout=900 --slowest test_getpath test_venv test_sysconfig test_sys test_subprocess test_import test_ctypes test.test_profiling.test_sampling_profiler.test_integration
