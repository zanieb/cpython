name: Relocatable audit
on: workflow_dispatch
permissions:
  contents: read
jobs:
  linux:
    name: '${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    uses: ./.github/workflows/reusable-relocatable.yml
    with:
      os: ${{ matrix.os }}
  macos:
    name: 'macOS ${{ matrix.framework }}'
    strategy:
      fail-fast: false
      matrix:
        framework: ['', 'Python', 'RelocatablePython']
    uses: ./.github/workflows/reusable-relocatable.yml
    with:
      os: macos-26
      framework: ${{ matrix.framework }}
