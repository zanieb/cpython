name: Windows no-tests validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check MSBuild property defaults and environment overrides
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'MSBuild was not found' }
          function Read-Projects($project) {
            $output = & $msbuild $project /nologo /p:Platform=x64 /p:Configuration=Release /getProperty:IncludeTests /getItem:Projects
            if ($LASTEXITCODE) { throw "MSBuild evaluation failed: $LASTEXITCODE" }
            return ($output | Out-String | ConvertFrom-Json)
          }
          $env:IncludeTests = $null
          $default = Read-Projects 'PCbuild/pcbuild.proj'
          if ($default.Properties.IncludeTests -ne 'true' -or '_testcapi.vcxproj' -notin $default.Items.Projects.Identity) { throw 'Default build omits test projects' }
          $env:IncludeTests = 'false'
          $disabled = Read-Projects 'PCbuild/pcbuild.proj'
          if ($disabled.Properties.IncludeTests -ne 'false' -or '_testcapi.vcxproj' -in $disabled.Items.Projects.Identity) { throw 'Environment override did not omit test projects' }
          $source = Get-Content PCbuild/pcbuild.proj -Raw
          $source.Replace("'`$(IncludeTests)' == ''", "'`$(IncludeTest)' == ''") | Set-Content PCbuild/pcbuild-before.proj
          $before = Read-Projects 'PCbuild/pcbuild-before.proj'
          if ($before.Properties.IncludeTests -ne 'true' -or '_testcapi.vcxproj' -notin $before.Items.Projects.Identity) { throw 'Original environment override bug did not reproduce' }
          Remove-Item PCbuild/pcbuild-before.proj
          $env:IncludeTests = $null
      - name: Build with the no-tests switch
        shell: cmd
        run: PCbuild\build.bat --no-tests -p x64 -c Release
      - name: Verify normal modules and absence of test projects
        shell: pwsh
        run: |
          $unexpected = Get-ChildItem PCbuild/amd64 -File | Where-Object { $_.Name -like '_test*.pyd' -or $_.Name -like '_testembed*.exe' -or $_.Name -like '_ctypes_test*.pyd' -or $_.Name -like 'xxlimited*.pyd' }
          if ($unexpected) { throw "Test artifacts were built: $($unexpected.Name -join ', ')" }
          & PCbuild/amd64/python.exe -c "import ctypes, importlib.util, sqlite3, ssl; assert importlib.util.find_spec('_testcapi') is None; print('Normal extensions import and test extensions are absent')"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify the default build still includes test projects
        shell: cmd
        run: |
          call PCbuild\build.bat -p x64 -c Release
          if errorlevel 1 exit /b 1
          PCbuild\amd64\python.exe -c "import _testcapi, _testinternalcapi; print('Default build includes test extensions')"
