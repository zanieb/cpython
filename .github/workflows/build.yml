name: Framework relocation diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  framework:
    name: '${{ matrix.mode }} ${{ matrix.framework }}'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: baseline
            framework: Python
            source: 22d79d9840a275ed6ed36cd590dc74edc61765fb
          - mode: relocatable
            framework: Python
            source: ef2e4c21d0af3be9002cdeee5defd2f9d845e608
          - mode: relocatable
            framework: RelocatablePython
            source: ef2e4c21d0af3be9002cdeee5defd2f9d845e608
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ matrix.mode }}
      FRAMEWORK: ${{ matrix.framework }}
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      PYTHONSTRICTEXTENSIONBUILD: 1
      PYTHON_COLORS: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Install dependencies
        run: |
          brew bundle --file=Misc/Brewfile
          brew install make
          echo "GDBM_CFLAGS=-I$(brew --prefix gdbm)/include" >> "$GITHUB_ENV"
          echo "GDBM_LIBS=-L$(brew --prefix gdbm)/lib -lgdbm" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$(brew --prefix openssl@3.5)" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$RUNNER_TEMP/framework-build" >> "$GITHUB_ENV"
          echo "INSTALL_DIR=$RUNNER_TEMP/framework-install" >> "$GITHUB_ENV"
      - name: Add diagnostic output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Lib/test/test_venv.py')
          s = p.read_text()
          s = s.replace('self.assertTrue(env_name.encode() in lines[0])',
                        'self.assertTrue(env_name.encode() in lines[0], (out, err, sys.executable))')
          p.write_text(s)
          p = Path('Lib/smtplib.py')
          s = p.read_text()
          needle = '            fqdn = socket.getfqdn()'
          assert s.count(needle) == 1
          s = s.replace(needle,
              '            import time\n'
              '            started = time.monotonic()\n'
              '            fqdn = socket.getfqdn()\n'
              '            print("getfqdn duration", time.monotonic() - started, "result", repr(fqdn), flush=True)')
          p.write_text(s)
          PY
      - name: Build and install
        run: |
          mkdir "$BUILD_DIR"
          cd "$BUILD_DIR"
          configure_args=(--prefix="$INSTALL_DIR" --enable-framework="$INSTALL_DIR/Library/Frameworks" --with-framework-name="$FRAMEWORK" --with-openssl="$OPENSSL_DIR")
          if [ "$MODE" = relocatable ]; then
            configure_args+=(--enable-relocatable)
          fi
          "$GITHUB_WORKSPACE/configure" "${configure_args[@]}"
          gmake -j4 > "$RUNNER_TEMP/build.log" 2>&1 || { tail -200 "$RUNNER_TEMP/build.log"; exit 1; }
          gmake install > "$RUNNER_TEMP/install.log" 2>&1 || { tail -200 "$RUNNER_TEMP/install.log"; exit 1; }
      - name: Prepare installed interpreter
        run: |
          mv "$BUILD_DIR" "${BUILD_DIR}-unavailable"
          if [ "$MODE" = relocatable ]; then
            mv "$INSTALL_DIR" "${INSTALL_DIR} moved"
            INSTALL_DIR="${INSTALL_DIR} moved"
          fi
          framework_dir="$INSTALL_DIR/Library/Frameworks/$FRAMEWORK.framework"
          framework_version=$(readlink "$framework_dir/Versions/Current")
          python_prefix="$framework_dir/Versions/$framework_version"
          echo "INSTALLED_PYTHON=$python_prefix/bin/python3" >> "$GITHUB_ENV"
          otool -L "$python_prefix/$FRAMEWORK"
          otool -L "$python_prefix/Resources/Python.app/Contents/MacOS/$FRAMEWORK"
          "$python_prefix/bin/python3" -I -c 'import sys, sysconfig; print(sys.version); print(sys.executable); print(sys.prefix); print(sysconfig.get_config_var("CONFIG_ARGS"))'
      - name: Run affected tests
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_INSERT_LIBRARIES
          unset DYLD_FRAMEWORK_PATH DYLD_FALLBACK_FRAMEWORK_PATH
          "$INSTALLED_PYTHON" -m test -v --timeout=900 test_c_stack_unwind test_venv test_smtplib
