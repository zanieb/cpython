name: Framework fixture audit
on: workflow_dispatch
permissions:
  contents: read
jobs:
  framework:
    name: '${{ matrix.mode }} ${{ matrix.framework }}'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: baseline
            framework: Python
            source: 1f2a6a40f1311229eff24101fea2664e432fcaa5
          - mode: relocatable
            framework: Python
            source: 1f2a6a40f1311229eff24101fea2664e432fcaa5
          - mode: relocatable
            framework: RelocatablePython
            source: 1f2a6a40f1311229eff24101fea2664e432fcaa5
    defaults:
      run:
        shell: bash
    env:
      MODE: ${{ matrix.mode }}
      FRAMEWORK: ${{ matrix.framework }}
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      PYTHONSTRICTEXTENSIONBUILD: 1
      PYTHON_COLORS: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Install dependencies
        run: |
          brew bundle --file=Misc/Brewfile
          brew install make
          echo "GDBM_CFLAGS=-I$(brew --prefix gdbm)/include" >> "$GITHUB_ENV"
          echo "GDBM_LIBS=-L$(brew --prefix gdbm)/lib -lgdbm" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$(brew --prefix openssl@3.5)" >> "$GITHUB_ENV"
          echo "BUILD_DIR=$RUNNER_TEMP/framework-build" >> "$GITHUB_ENV"
          echo "INSTALL_DIR=$RUNNER_TEMP/framework-install" >> "$GITHUB_ENV"
      - name: Build and install
        run: |
          mkdir "$BUILD_DIR"
          cd "$BUILD_DIR"
          configure_args=(--prefix="$INSTALL_DIR" --enable-framework="$INSTALL_DIR/Library/Frameworks" --with-framework-name="$FRAMEWORK" --with-openssl="$OPENSSL_DIR")
          if [ "$MODE" = relocatable ]; then
            configure_args+=(--enable-relocatable)
          fi
          "$GITHUB_WORKSPACE/configure" "${configure_args[@]}"
          gmake -j4 > "$RUNNER_TEMP/build.log" 2>&1 || { tail -200 "$RUNNER_TEMP/build.log"; exit 1; }
          gmake install > "$RUNNER_TEMP/install.log" 2>&1 || { tail -200 "$RUNNER_TEMP/install.log"; exit 1; }
      - name: Prepare installed interpreter
        run: |
          mv "$BUILD_DIR" "${BUILD_DIR}-unavailable"
          if [ "$MODE" = relocatable ]; then
            mv "$INSTALL_DIR" "${INSTALL_DIR} moved"
            INSTALL_DIR="${INSTALL_DIR} moved"
          fi
          framework_dir="$INSTALL_DIR/Library/Frameworks/$FRAMEWORK.framework"
          framework_version=$(readlink "$framework_dir/Versions/Current")
          python_prefix="$framework_dir/Versions/$framework_version"
          echo "INSTALLED_PYTHON=$python_prefix/bin/python3" >> "$GITHUB_ENV"
          otool -L "$python_prefix/$FRAMEWORK"
          otool -L "$python_prefix/Resources/Python.app/Contents/MacOS/$FRAMEWORK"
          "$python_prefix/bin/python3" -I -c 'import sys, sysconfig; print(sys.version); print(sys.executable); print(sys.prefix); print(sysconfig.get_config_var("CONFIG_ARGS"))'
      - name: Run framework fixture tests
        run: |
          unset LD_LIBRARY_PATH LD_PRELOAD
          unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_INSERT_LIBRARIES
          unset DYLD_FRAMEWORK_PATH DYLD_FALLBACK_FRAMEWORK_PATH
          "$INSTALLED_PYTHON" -m test -v -u cpu --timeout=900 test_c_stack_unwind test_venv
      - name: Diagnose SMTP hostname resolution
        if: matrix.mode == 'baseline'
        run: |
          "$INSTALLED_PYTHON" - <<'PYCODE'
          import json
          import socket
          import time
          import unittest
          from unittest import mock
          from test.test_smtplib import SMTPSimTests
          original = socket.gethostbyname
          calls = []
          def timed(host):
              started = time.monotonic()
              try:
                  result = original(host)
                  calls.append({'host': host, 'seconds': time.monotonic() - started, 'result': result})
                  return result
              except Exception as exc:
                  calls.append({'host': host, 'seconds': time.monotonic() - started, 'error': repr(exc)})
                  raise
          names = ['test_with_statement', 'test_with_statement_QUIT_failure']
          for label, lookup in [('real_lookup', timed), ('loopback_lookup', lambda host: '127.0.0.1')]:
              with mock.patch.object(socket, 'gethostbyname', lookup):
                  result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(SMTPSimTests(name) for name in names))
              print(json.dumps({'mode': label, 'success': result.wasSuccessful(), 'calls': calls}), flush=True)
              if label == 'loopback_lookup':
                  assert result.wasSuccessful()
          PYCODE
