name: Reusable check HTML IDs

on:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  check-html-ids:
    name: 'Check for removed HTML IDs'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 'Check out PR head'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: 'Find merge base'
        id: merge-base
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git fetch --depth=$((${{ github.event.pull_request.commits }} + 10)) --no-tags origin "$BASE" "$HEAD"

          if ! MERGE_BASE=$(git merge-base "$BASE" "$HEAD" 2>/dev/null); then
            git fetch --deepen=1 --no-tags origin "$BASE" "$HEAD"

            OLDEST=$(git rev-list --reflog --max-parents=0 --reverse "${BASE}^" "${HEAD}^" | head -1)
            TIMESTAMP=$(git show --format=%at --no-patch "$OLDEST")

            git fetch --shallow-since="$TIMESTAMP" --no-tags origin "$BASE" "$HEAD"

            MERGE_BASE=$(git merge-base "$BASE" "$HEAD")
          fi
          echo "sha=$MERGE_BASE" >> "$GITHUB_OUTPUT"
      - name: 'Create worktree at merge base'
        env:
          MERGE_BASE: ${{ steps.merge-base.outputs.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/merge-base" "$MERGE_BASE" --detach
          echo "MERGE_BASE_DIR=$RUNNER_TEMP/merge-base" >> "$GITHUB_ENV"
      - name: 'Set up Python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
      - name: Fingerprint merge-base dependency inputs
        id: dependency-inputs
        run: |
          python - <<'PYTHON'
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ['MERGE_BASE_DIR'])
          digest = hashlib.sha256()
          for name in ('Doc/pylock.toml', 'Doc/requirements.txt', 'Doc/requirements.in',
                       'Doc/constraints.txt', 'Doc/Makefile',
                       'Doc/tools/create_venv.py', 'Tools/requirements-bootstrap.txt'):
              path = root / name
              if path.is_file():
                  digest.update(name.encode() + b'\0' + path.read_bytes())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'key={digest.hexdigest()}', file=output)
          PYTHON
      - name: Restore merge-base package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-docs-base-3.12.13-${{ steps.dependency-inputs.outputs.key }}
      - name: 'Install build dependencies'
        run: make -C "$MERGE_BASE_DIR/Doc" UV=false venv
      - name: 'Build HTML documentation'
        run: make -C "$MERGE_BASE_DIR/Doc" SPHINXOPTS="--quiet" html
      - name: 'Collect HTML IDs'
        run: python Doc/tools/check-html-ids.py collect "$MERGE_BASE_DIR/Doc/build/html" -o /tmp/html-ids-base.json.gz
      - name: 'Download PR head HTML IDs'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: html-ids-head.json.gz
          path: /tmp
      - name: 'Check for removed HTML IDs'
        run: |
          # shellcheck disable=SC2046
          python Doc/tools/check-html-ids.py -v check \
            /tmp/html-ids-base.json.gz /tmp/html-ids-head.json.gz \
            $([ -f Doc/tools/removed-ids.txt ] && echo "--exclude-file Doc/tools/removed-ids.txt")
