name: Reusable relocatable Python

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      framework:
        type: string
        default: ''

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  build-install-test:
    name: build, relocate and test
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      FRAMEWORK: ${{ inputs.framework }}
      PYTHONSTRICTEXTENSIONBUILD: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set build and installation directories
      run: |
        echo "BUILD_DIR=$RUNNER_TEMP/relocatable-build" >> "$GITHUB_ENV"
        echo "INSTALL_DIR=$RUNNER_TEMP/relocatable-install" >> "$GITHUB_ENV"
    - name: Install dependencies
      if: runner.os == 'Linux'
      run: sudo ./.github/workflows/posix-deps-apt.sh
    - name: Install Homebrew dependencies
      if: runner.os == 'macOS'
      run: |
        brew bundle --file=Misc/Brewfile
        brew install make
        echo "GDBM_CFLAGS=-I$(brew --prefix gdbm)/include" >> "$GITHUB_ENV"
        echo "GDBM_LIBS=-L$(brew --prefix gdbm)/lib -lgdbm" >> "$GITHUB_ENV"
        echo "OPENSSL_DIR=$(brew --prefix openssl@3.5)" >> "$GITHUB_ENV"
    - name: Configure CPython
      run: |
        mkdir "$BUILD_DIR"
        cd "$BUILD_DIR"
        configure_args=(--prefix="$INSTALL_DIR" --enable-relocatable)
        if [ -n "$FRAMEWORK" ]; then
          configure_args+=(--enable-framework="$INSTALL_DIR/Library/Frameworks" --with-framework-name="$FRAMEWORK")
        else
          configure_args+=(--enable-shared)
        fi
        if [ -n "${OPENSSL_DIR:-}" ]; then
          configure_args+=(--with-openssl="$OPENSSL_DIR")
        fi
        "$GITHUB_WORKSPACE/configure" "${configure_args[@]}"
    - name: Build and install CPython
      working-directory: ${{ env.BUILD_DIR }}
      run: |
        make_command=make
        if [ "$RUNNER_OS" = macOS ]; then
          make_command=gmake
        fi
        "$make_command" -j4
        "$make_command" install
    - name: Check build-tree library selection
      if: runner.os == 'Linux'
      run: |
        fixture="$RUNNER_TEMP/library-selection"
        mkdir -p "$fixture/build" "$fixture/lib"
        cp "$BUILD_DIR/python" "$BUILD_DIR/libpython"*.so.1.0 "$fixture/build/"
        cat > "$fixture/wrong-library.c" <<'C'
        int Py_BytesMain(int argc, char **argv) { return 79; }
        C
        library=$(basename "$BUILD_DIR"/libpython*.so.1.0)
        cc -shared -fPIC "$fixture/wrong-library.c" \
          -Wl,-soname,"$library" -o "$fixture/lib/$library"
        LD_LIBRARY_PATH="$fixture/build" PYTHONHOME="$INSTALL_DIR" \
          "$fixture/build/python" -c 'import sys; print(sys.version)'
    - name: Move the installation and build directory
      run: |
        mv "$INSTALL_DIR" "${INSTALL_DIR} moved"
        mv "$BUILD_DIR" "${BUILD_DIR}-unavailable"
        echo "INSTALL_DIR=${INSTALL_DIR} moved" >> "$GITHUB_ENV"
    - name: Run the relocated interpreter
      run: |
        unset LD_LIBRARY_PATH LD_PRELOAD
        unset DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH DYLD_INSERT_LIBRARIES
        unset DYLD_FRAMEWORK_PATH DYLD_FALLBACK_FRAMEWORK_PATH
        export PYTHON_PREFIX="$INSTALL_DIR"
        if [ -n "$FRAMEWORK" ]; then
          framework_dir="$INSTALL_DIR/Library/Frameworks/$FRAMEWORK.framework"
          framework_version=$(readlink "$framework_dir/Versions/Current")
          export PYTHON_PREFIX="$framework_dir/Versions/$framework_version"
          "$PYTHON_PREFIX/Resources/Python.app/Contents/MacOS/$FRAMEWORK" -I -c 'import ssl, ctypes; print("Direct app launch succeeded")'
        fi
        installed_python="$PYTHON_PREFIX/bin/python3"
        "$installed_python" -I - <<'PY'
        import os
        import subprocess
        import sys
        import sysconfig
        import tempfile
        import venv

        prefix = os.path.realpath(os.environ['PYTHON_PREFIX'])
        assert os.path.realpath(sys.prefix) == prefix, sys.prefix
        assert sys.exec_prefix == sys.prefix, sys.exec_prefix
        assert sysconfig.get_config_var('RELOCATABLE') == 'yes'
        assert not sysconfig.is_python_build()
        for entry in sys.path:
            assert os.path.commonpath((prefix, os.path.realpath(entry))) == prefix, entry
        for symlinks in (False, True):
            with tempfile.TemporaryDirectory() as directory:
                venv.EnvBuilder(symlinks=symlinks).create(directory)
                subprocess.run([
                    os.path.join(directory, 'bin', 'python'), '-I', '-c',
                    'import ctypes, sys, sysconfig; '
                    'ctypes.CDLL(("@rpath/" if sys.platform == "darwin" else "") + '
                    'sysconfig.get_config_var("INSTSONAME"))',
                ], check=True)
        PY
        "$installed_python" -m test.pythoninfo
        if [ "$RUNNER_OS" = Linux ]; then
          xvfb-run "$installed_python" -m test --fast-ci --timeout=900
        else
          "$installed_python" -m test --fast-ci --timeout=900
        fi
