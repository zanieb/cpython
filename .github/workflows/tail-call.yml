name: Tail calling interpreter
on:
  pull_request:
    paths: &paths
      - '.github/workflows/tail-call.yml'
      - '.github/workflows/macos-deps.sh'
      - 'Python/bytecodes.c'
      - 'Python/ceval.c'
      - 'Python/ceval_macros.h'
      - 'Python/generated_cases.c.h'
  push:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1
  LLVM_VERSION: 21

jobs:
  macos:
    name: aarch64-apple-darwin/clang
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          brew update
          brew install --force-bottle llvm@${{ env.LLVM_VERSION }}
      - name: Build
        run: |
          export SDKROOT="$(xcrun --show-sdk-path)"
          export PATH="/usr/local/opt/llvm@${{ env.LLVM_VERSION }}/bin:$PATH"
          export PATH="/opt/homebrew/opt/llvm@${{ env.LLVM_VERSION }}/bin:$PATH"
          CC=clang-${{ env.LLVM_VERSION }} ./configure --with-tail-call-interp
          make all --jobs 4
      - name: Test
        run: |
          ./python.exe -m test --multiprocess 0 --timeout 4500 --verbose2 --verbose3

  macos-intel-build:
    name: Cross-build macOS Intel on ARM
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      workspace: ${{ steps.workspace.outputs.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          test "$(uname -m)" = arm64
          brew update
          brew install --force-bottle llvm@${{ env.LLVM_VERSION }} pkgconf
          echo "$(brew --prefix llvm@${{ env.LLVM_VERSION }})/bin" >> "$GITHUB_PATH"
      - name: Read dependency configuration
        id: deps-config
        env:
          CC: clang-${{ env.LLVM_VERSION }}
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          import subprocess

          h = hashlib.sha256()
          h.update(Path(".github/workflows/macos-deps.sh").read_bytes())
          for command in (
              [os.environ["CC"], "--version"],
              ["xcodebuild", "-version"],
              ["xcrun", "--show-sdk-path"],
              ["xcrun", "--show-sdk-build-version"],
          ):
              h.update(subprocess.check_output(command))
          # Tcl/Tk records absolute paths to its runtime libraries.
          h.update(str(Path(".cross-deps").resolve()).encode())
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"deps-hash={h.hexdigest()}\n")
      - name: Cache cross-built libraries
        id: macos-deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cross-deps
          key: macos-intel-deps-${{ runner.arch }}-${{ steps.deps-config.outputs.deps-hash }}
      - name: Build native Python for build tools
        run: |
          mkdir -p "$RUNNER_TEMP/build-python"
          cd "$RUNNER_TEMP/build-python"
          CC=clang-${{ env.LLVM_VERSION }} "$GITHUB_WORKSPACE/configure" \
            --without-ensurepip --with-suffix=.exe
          make all --jobs 4
      - name: Cross-build libraries
        if: steps.macos-deps.outputs.cache-hit != 'true'
        env:
          CC: clang-${{ env.LLVM_VERSION }}
        run: bash .github/workflows/macos-deps.sh "$GITHUB_WORKSPACE/.cross-deps" "$RUNNER_TEMP/macos-deps"
      - name: Cross-build Python
        env:
          PYTHONSTRICTEXTENSIONBUILD: 1
        run: |
          export SDKROOT="$(xcrun --show-sdk-path)"
          export MACOSX_DEPLOYMENT_TARGET=26.0
          export CC="clang-${{ env.LLVM_VERSION }} -arch x86_64"
          export CXX="clang++ -arch x86_64"
          export CFLAGS="-arch x86_64"
          deps="$GITHUB_WORKSPACE/.cross-deps"
          export CPPFLAGS="-I$deps/include"
          export LDFLAGS="-arch x86_64 -L$deps/lib"
          export PKG_CONFIG="pkg-config --static"
          export PKG_CONFIG_PATH=""
          export PKG_CONFIG_LIBDIR="$deps/lib/pkgconfig:$deps/share/pkgconfig"
          # The macOS SDK provides `libtermcap` without the `termcap.pc` required by `readline.pc`.
          export LIBREADLINE_CFLAGS="-I$deps/include"
          export LIBREADLINE_LIBS="-L$deps/lib -lreadline -ltermcap"
          # By default, `configure` clears the Darwin release when cross-compiling,
          # which hides APIs such as `sendfile`. Set it and cache results for checks
          # that cannot run while cross-compiling.
          MACHDEP=darwin \
          ac_sys_system=Darwin \
          ac_sys_release="$(uname -r)" \
          ac_cv_file__dev_ptmx=yes \
          ac_cv_file__dev_ptc=no \
          ac_cv_aligned_required=no \
          ac_cv_working_tzset=yes \
          ac_cv_pthread_is_default=yes \
          ac_cv_pthread_system_supported=yes \
          ./configure \
            --build="$(./config.guess)" \
            --host=x86_64-apple-darwin \
            --with-build-python="$RUNNER_TEMP/build-python/python.exe" \
            --with-suffix=.exe \
            --with-openssl="$deps" \
            --enable-ipv6 \
            --with-tail-call-interp
          make all --jobs 4
          for binary in python.exe Programs/_testembed; do
            test "$(lipo -archs "$binary")" = x86_64
          done
      - name: Archive Python build
        id: workspace
        run: |
          echo "path=$(pwd -P)" >> "$GITHUB_OUTPUT"
          # Include the source tree, libraries, test programs, and module symlinks.
          tar --exclude=.git -czf "$RUNNER_TEMP/python-intel.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tail-call-macos-intel-build
          path: ${{ runner.temp }}/python-intel.tar.gz
          if-no-files-found: error
          retention-days: 1

  macos-intel:
    name: x86_64-apple-darwin/clang
    needs: macos-intel-build
    if: ${{ !cancelled() }}
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - name: Check build result
        env:
          BUILD_RESULT: ${{ needs.macos-intel-build.result }}
        run: test "$BUILD_RESULT" = success
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tail-call-macos-intel-build
          path: ${{ runner.temp }}
      - name: Restore Python build and libraries
        env:
          BUILD_WORKSPACE: ${{ needs.macos-intel-build.outputs.workspace }}
        run: |
          # The build records absolute source paths used by the test suite.
          test "$(pwd -P)" = "$BUILD_WORKSPACE"
          tar -xzf "$RUNNER_TEMP/python-intel.tar.gz"
      - name: Verify Intel tail-call interpreter and extensions
        run: |
          test "$(uname -m)" = x86_64
          ./python.exe Tools/build/check_extension_modules.py --strict
          ./python.exe - <<'PY'
          import platform
          import sysconfig
          import tkinter

          assert platform.machine() == "x86_64"
          assert sysconfig.get_config_var("_Py_TAIL_CALL_INTERP") == 1
          print("Tcl version:", tkinter.Tcl().eval("info patchlevel"))
          PY
          ./python.exe -m test.pythoninfo
      - name: Test
        run: |
          ./python.exe -m test --multiprocess 0 --timeout 4500 --verbose2 --verbose3

  linux:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu/gcc
            runner: ubuntu-26.04
            configure_flags: --with-pydebug
          - target: x86_64-unknown-linux-gnu/gcc-free-threading
            runner: ubuntu-26.04
            configure_flags: --disable-gil
          - target: aarch64-unknown-linux-gnu/gcc
            runner: ubuntu-26.04-arm
            configure_flags: --with-pydebug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Build
        run: |
          # On ubuntu-26.04 image, clang is clang-21 by default
          CC=clang-${{ env.LLVM_VERSION }} ./configure --with-tail-call-interp ${{ matrix.configure_flags }}
          make all --jobs 4
      - name: Test
        run: |
          ./python -m test --multiprocess 0 --timeout 4500 --verbose2 --verbose3
