# Any data that can vary between Python versions is to be kept in this file.
# This allows for blanket copying of the Emscripten build code between supported
# Python versions.
emscripten-version = "6.0.10"
node-version = "24"
test-args = [
    "-m", "test",
    "-v",
    "-uall",
    "--rerun",
    "--single-process",
    "-W",
]
pythoninfo-args = [
    "-m", "test.pythoninfo",
]

[dependencies]
libffi = "libffi-3.4.6"
mpdec = "mpdecimal-4.0.1"
