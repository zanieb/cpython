# Dependency inputs for CI and development tools. Install the committed locks.
[dependency-groups]
docs = [
    # Keep the Sphinx minimum in sync with `Doc/conf.py`.
    "sphinx>=8.2.0,<9.0.0",
    "pygments>=2.21",
    "blurb",
    "sphinx-linklint",
    "sphinx-notfound-page~=1.0.0",
    "sphinxext-opengraph~=0.13.0",
    "sphinxext-rediraffe",
    "python-docs-theme>=2023.3.1,!=2023.7",
]
epubcheck = ["epubcheck"]
typing = [
    "mypy",
    # Type stubs used by the PEG generator.
    "types-psutil",
    "types-setuptools",
]
hypothesis = ["hypothesis"]
# Build tools for documentation and Hypothesis source distributions.
build-tools = ["setuptools", "wheel", "maturin>=1.9.4,<2"]
